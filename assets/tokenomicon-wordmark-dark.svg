<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 140" width="640" height="140" role="img" aria-label="Tokenomicon" xmlns:c2pa="http://c2pa.org/manifest">
  <g transform="translate(6 6)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b1f55"/>
      <stop offset="1" stop-color="#120c26"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="coin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe27a"/>
      <stop offset="1" stop-color="#f4a71d"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b6bff"/>
      <stop offset="1" stop-color="#6a3fe0"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd54a" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffd54a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- summoning beam + glow -->
  <path d="M44 80 L54 46 L74 46 L84 80 Z" fill="url(#beam)"/>
  <circle cx="64" cy="44" r="36" fill="url(#glow)"/>

  <!-- the book -->
  <path d="M12 82 Q38 73 64 84 Q90 73 116 82 L116 110 Q90 101 64 112 Q38 101 12 110 Z" fill="url(#cover)"/>
  <path d="M18 77 Q42 68 64 79 L64 105 Q42 95 18 103 Z" fill="#fbf1dc"/>
  <path d="M110 77 Q86 68 64 79 L64 105 Q86 95 110 103 Z" fill="#f1e3c4"/>
  <path d="M64 79 L64 106" stroke="#c9b48a" stroke-width="1.6" stroke-linecap="round"/>
  <g fill="none" stroke="#c9b48a" stroke-width="2" stroke-linecap="round">
    <path d="M26 82 Q40 76 56 83"/>
    <path d="M26 88 Q40 82 56 89"/>
    <path d="M26 94 Q36 89 46 93"/>
    <path d="M72 83 Q88 76 102 82"/>
    <path d="M72 89 Q88 82 102 88"/>
    <path d="M82 93 Q92 89 102 94"/>
  </g>

  <!-- the all-seeing coin -->
  <circle cx="64" cy="44" r="22" fill="#d98a0b"/>
  <circle cx="64" cy="42.5" r="21" fill="url(#coin)"/>
  <circle cx="64" cy="42.5" r="16.5" fill="none" stroke="#d98a0b" stroke-width="1.6" stroke-dasharray="2.2 2.6"/>
  <path d="M50 42.5 Q64 30 78 42.5 Q64 55 50 42.5 Z" fill="#fffaf0" stroke="#9a5b00" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="65.5" cy="42.5" r="5.4" fill="#2b1f55"/>
  <circle cx="67.4" cy="40.6" r="1.7" fill="#ffffff"/>
  <path d="M49.5 34 Q53 26 61 24.5" fill="none" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2.4" stroke-linecap="round"/>

  <!-- sparkles -->
  <path d="M27 22 Q27 30 35 30 Q27 30 27 38 Q27 30 19 30 Q27 30 27 22 Z" fill="#5eead4"/>
  <path d="M103 18 Q103 24 109 24 Q103 24 103 30 Q103 24 97 24 Q103 24 103 18 Z" fill="#f472b6"/>
  <path d="M100 52 Q100 56 104 56 Q100 56 100 60 Q100 56 96 56 Q100 56 100 52 Z" fill="#ffd54a"/>
  <circle cx="36" cy="58" r="2" fill="#ffd54a" opacity="0.8"/>
  <circle cx="90" cy="68" r="1.6" fill="#5eead4" opacity="0.8"/>

  </g>
  <text x="156" y="78" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="58" font-weight="800" letter-spacing="-1.5" fill="#f6f2ff">Token<tspan fill="#f4a71d">o</tspan>micon</text>
  <text x="159" y="112" font-family="ui-rounded, 'SF Pro Rounded', 'Nunito', 'Quicksand', system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="600" letter-spacing="0.4" fill="#a99fd0">Every token you summoned. And what it cost you.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
